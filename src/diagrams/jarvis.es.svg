<svg lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 522" role="img" aria-labelledby="t d" width="100%" preserveAspectRatio="xMidYMid meet">
<title id="t">Enrutador de seguridad de JARVIS</title><desc id="d">Un asistente de voz local: entrada de voz, palabra de activación, voz a texto, y un enrutador en código que manda cada petición a una herramienta segura, una compuerta de confirmación, el LLM local o un bloqueo. Las respuestas se dicen en voz alta.</desc>
<style>
    :root{--dg-fg:#14120f;--dg-mut:#5d574c;--dg-accent:#e8572a;--dg-on-accent:#0e0e10}
    @media (prefers-color-scheme:dark){:root{--dg-fg:#f4efe6;--dg-mut:#b8b0a0}}
    .box{fill:none;stroke:var(--dg-fg);stroke-width:1.6}
    .key{fill:var(--dg-accent);stroke:var(--dg-accent)}
    .lab{font:700 18px 'Archivo','Helvetica Neue',Arial,sans-serif;fill:var(--dg-fg)}
    .sub{font:400 13px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:var(--dg-mut)}
    .num{font:500 13px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:var(--dg-mut)}
    .cap{font:500 13px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:var(--dg-mut);letter-spacing:.08em}
    .note{font:500 15px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:var(--dg-fg)}
    .arr{fill:none;stroke:var(--dg-fg);stroke-width:1.6}
    .elab{font:500 13px 'IBM Plex Mono',ui-monospace,Consolas,monospace;fill:var(--dg-fg)}
    .on{fill:var(--dg-on-accent)}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--dg-fg)"/></marker></defs>
<text class="cap" x="25" y="30">ARQUITECTURA / JARVIS</text>
<path class="arr" d="M215 110 L263 110" marker-end="url(#ah)"/>
<path class="arr" d="M455 110 L503 110" marker-end="url(#ah)"/>
<path class="arr" d="M695 110 L743 110" marker-end="url(#ah)"/>
<path class="arr" d="M840 158 L840 185 L120 185 L120 210" marker-end="url(#ah)"/>
<path class="arr" d="M840 158 L840 185 L360 185 L360 210" marker-end="url(#ah)"/>
<path class="arr" d="M840 158 L840 185 L600 185 L600 210" marker-end="url(#ah)"/>
<path class="arr" d="M840 158 L840 210" marker-end="url(#ah)"/>
<path class="arr" d="M360 308 L360 335 L600 335 L600 360" marker-end="url(#ah)"/>
<path class="arr" d="M600 308 L600 360" marker-end="url(#ah)"/>
<path class="arr" d="M840 308 L840 335 L600 335 L600 360" marker-end="url(#ah)"/>
<rect class="box" x="25" y="62" width="190" height="96" rx="10"/>
<text class="num" x="39" y="86">01</text>
<text class="lab" x="39" y="116">Voz de entrada</text>
<text class="sub" x="39" y="140">micrófono o tecla F9</text>
<rect class="box" x="265" y="62" width="190" height="96" rx="10"/>
<text class="num" x="279" y="86">02</text>
<text class="lab" x="279" y="116">Palabra clave</text>
<text class="sub" x="279" y="140">modelo local</text>
<rect class="box" x="505" y="62" width="190" height="96" rx="10"/>
<text class="num" x="519" y="86">03</text>
<text class="lab" x="519" y="116">Voz a texto</text>
<text class="sub" x="519" y="140">CPU, local</text>
<rect class="box key" x="745" y="62" width="190" height="96" rx="10"/>
<text class="num on" x="759" y="86">04</text>
<text class="lab on" x="759" y="116">Enrutador</text>
<text class="sub on" x="759" y="140">decide el código</text>
<rect class="box" x="25" y="212" width="190" height="96" rx="10"/>
<text class="num" x="39" y="236">05</text>
<text class="lab" x="39" y="266">Bloqueado</text>
<text class="sub" x="39" y="290">nunca se ejecuta</text>
<rect class="box" x="265" y="212" width="190" height="96" rx="10"/>
<text class="num" x="279" y="236">06</text>
<text class="lab" x="279" y="266">LLM local</text>
<text class="sub" x="279" y="290">modelo 4B, CPU</text>
<rect class="box" x="505" y="212" width="190" height="96" rx="10"/>
<text class="num" x="519" y="236">07</text>
<text class="lab" x="519" y="266">Confirmación</text>
<text class="sub" x="519" y="290">herramientas riesgosas</text>
<rect class="box" x="745" y="212" width="190" height="96" rx="10"/>
<text class="num" x="759" y="236">08</text>
<text class="lab" x="759" y="266">Herramienta segura</text>
<text class="sub" x="759" y="290">corre directo</text>
<rect class="box" x="505" y="362" width="190" height="96" rx="10"/>
<text class="num" x="519" y="386">09</text>
<text class="lab" x="519" y="416">Texto a voz</text>
<text class="sub" x="519" y="440">respuesta hablada</text>
<text class="note" x="25" y="504">El modelo propone; el código decide. Las herramientas prohibidas no existen como herramientas.</text>
</svg>