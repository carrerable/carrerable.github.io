name: Quality budgets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    if: github.repository == 'carrerable/carrerable.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.a11y.config.ts
      - run: npx lhci autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            playwright-report/a11y
            .lighthouseci-report
          retention-days: 14
